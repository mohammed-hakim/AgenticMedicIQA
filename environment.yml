# Medical AgenticIQA Conda Environment
# Usage: conda env create -f environment.yml

name: medical-agentic-iqa
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch-cuda=12.1
  - pip

  # Install remaining dependencies via pip
  - pip:
    - torch==2.3.0
    - torchvision==0.18.0
    - transformers==4.42.0
    - accelerate==0.31.0
    - bitsandbytes==0.43.1
    - langgraph
    - langchain-core>=1.0.0,<2.0.0
    - langchain-openai>=1.0.0,<2.0.0
    - langchain-anthropic>=1.0.0,<2.0.0
    - pydantic>=2.7.4,<3.0.0
    - pyiqa
    - opencv-python
    - pillow
    - numpy
    - scipy
    - scikit-image
    - einops
    - pydicom>=2.4,<4.0
    - nibabel>=5.0,<6.0
    - openai>=2.0.0,<3.0.0
    - anthropic>=0.72.0,<1.0.0
    - google-genai
    - httpx>=0.28.1,<1.0.0
    - qwen-vl-utils==0.0.8
    - typer
    - rich
    - loguru
    - pyyaml
    - tqdm
    - python-dotenv
    - fastapi>=0.100.0,<1.0.0
    - uvicorn[standard]>=0.23.0,<1.0.0
    - pytest
    - pytest-cov

# Note: For CPU-only installation, remove pytorch-cuda=12.1
# and install CPU version of PyTorch via pip
